name: libdbus
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev dbus pkg-config python3
      - name: Verify package and independent consumer
        run: bash ci/check.sh
